name: CI and deploy

permissions:
  contents: read

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          NEXT_PUBLIC_URL: https://cristinapsi.online

  deploy:
    needs: verify
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
      - name: Copy release to VPS
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          SSH_OPTS="-i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=yes -p ${DEPLOY_PORT:-22}"
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /opt/psi/releases/$GITHUB_SHA"
          rsync -az --delete --exclude='.git' --exclude='.github' --exclude='.env' -e "ssh $SSH_OPTS" ./ "$DEPLOY_USER@$DEPLOY_HOST:/opt/psi/releases/$GITHUB_SHA/"
      - name: Build and reload PM2
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash /opt/psi/releases/$GITHUB_SHA/deploy/release-pm2.sh"
      - name: Check public site
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            https://cristinapsi.online/ --output /tmp/psi-home.html
          if ! grep -q '/_next/static/' /tmp/psi-home.html; then
            echo 'The public domain is not serving the Next.js application' >&2
            exit 1
          fi
          css_path=$(grep -oE '/_next/static/[^" ]+\.css' /tmp/psi-home.html | sed -n '1p')
          test -n "$css_path"
          curl --fail --silent --show-error "https://cristinapsi.online$css_path" --output /dev/null
          login_redirect=$(curl --silent --show-error --output /dev/null --write-out '%{redirect_url}' \
            https://cristinapsi.online/area-restrita)
          case "$login_redirect" in
            https://cristinapsi.online/login\?next=*) ;;
            *) echo "Unexpected login redirect: $login_redirect" >&2; exit 1 ;;
          esac
