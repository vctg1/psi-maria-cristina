server {
    listen 80;
    listen [::]:80;
    server_name cristinapsi.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/psi-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cristinapsi.online;

    ssl_certificate /etc/letsencrypt/live/cristinapsi.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cristinapsi.online/privkey.pem;

    client_max_body_size 20m;
    auth_basic "Previa restrita";
    auth_basic_user_file /etc/nginx/psi-preview.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
