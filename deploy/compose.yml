name: psi_maria_cristina

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: psi_maria_cristina
      POSTGRES_USER: psi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in /opt/psi/.env}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psi -d psi_maria_cristina"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
